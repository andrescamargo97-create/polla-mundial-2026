:root {

  --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#085041;
  --amber:#BA7517;--amber-light:#FAEEDA;
  --red:#A32D2D;
  --text:#1a1a18;--text-muted:#5F5E5A;
  --bg:#ffffff;--bg2:#F7F6F2;--bg3:#F1EFE8;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --r:10px;--r2:6px;--r3:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--text);min-height:100vh;}
.app-header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.app-header h1{font-size:16px;font-weight:600;}
.app-header p{font-size:11px;opacity:0.8;margin-top:1px;}
.btn-logout{background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:12px;padding:5px 10px;border-radius:var(--r2);cursor:pointer;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid var(--border);display:flex;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 12px;cursor:pointer;color:var(--text-muted);font-size:10px;gap:3px;border:none;background:none;}
.nav-item.active{color:var(--blue);}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.screen{display:none;padding:16px 12px 90px;max-width:600px;margin:0 auto;}
.screen.active{display:block;}
.card{background:#fff;border-radius:var(--r3);border:0.5px solid var(--border);padding:14px;margin-bottom:10px;}
.field{margin-bottom:12px;}
.field label{font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px;}
.field input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:15px;background:#fff;color:var(--text);}
.field input:focus{outline:none;border-color:var(--blue);}
.btn{display:block;width:100%;padding:13px;border-radius:var(--r);border:none;font-size:15px;font-weight:600;cursor:pointer;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-blue:hover{background:var(--blue-dark);}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text);font-size:14px;font-weight:500;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
#screen-login{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:32px 20px 40px;max-width:420px;margin:0 auto;}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .ball{font-size:56px;display:block;}
.login-logo h2{font-size:22px;font-weight:700;}
.login-logo p{font-size:13px;color:var(--text-muted);margin-top:4px;}
.match-card{background:#fff;border-radius:var(--r3);border:0.5px solid var(--border);padding:12px;margin-bottom:8px;}
.match-card.has-result{border-color:var(--green);}
.match-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:8px;}
.match-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;}
.team{font-size:13px;font-weight:600;}
.team.right{text-align:right;}
.scores{display:flex;gap:6px;align-items:center;}
.score-box{width:40px;height:38px;text-align:center;font-size:18px;font-weight:700;border:1.5px solid var(--border2);border-radius:var(--r2);background:var(--bg2);color:var(--text);-moz-appearance:textfield;}
.score-box::-webkit-outer-spin-button,.score-box::-webkit-inner-spin-button{-webkit-appearance:none;}
.score-box:focus{outline:none;border-color:var(--blue);background:var(--blue-light);}
.score-box.real{border-color:var(--green);background:var(--green-light);color:var(--green-dark);}
.score-sep{font-size:16px;color:var(--text-muted);}
.pts-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px;}
.pts-3{background:var(--green-light);color:var(--green-dark);}
.pts-1{background:var(--amber-light);color:var(--amber);}
.pts-0{background:var(--bg3);color:var(--text-muted);}
.result-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.real-label{font-size:11px;color:var(--green);}
.day-sep{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;padding:14px 2px 6px;border-bottom:0.5px solid var(--border);margin-bottom:8px;}
.phase-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;margin-bottom:4px;scrollbar-width:none;}
.phase-scroll::-webkit-scrollbar{display:none;}
.phase-chip{flex-shrink:0;padding:5px 14px;border-radius:99px;border:1px solid var(--border2);font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:var(--text-muted);white-space:nowrap;}
.phase-chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);}
.rank-row:last-child{border-bottom:none;}
.rank-pos{font-size:15px;width:28px;text-align:center;}
.rank-avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-light);color:var(--blue-dark);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-cargo{font-size:11px;color:var(--text-muted);}
.rank-pts{font-size:18px;font-weight:700;color:var(--blue);}
.rank-detail{font-size:11px;color:var(--text-muted);text-align:right;}
.rank-me{background:var(--blue-light);border-radius:var(--r);padding:2px 4px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-box{background:var(--bg2);border-radius:var(--r);padding:10px;text-align:center;}
.stat-num{font-size:22px;font-weight:700;color:var(--blue);}
.stat-lbl{font-size:10px;color:var(--text-muted);margin-top:2px;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.loading{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}
.info-box{background:var(--blue-light);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--blue-dark);margin-bottom:12px;line-height:1.5;}
.info-box.green{background:var(--green-light);color:var(--green-dark);}
.saved-flash{font-size:11px;color:var(--green);text-align:center;margin-top:4px;min-height:16px;}
.profile-header{text-align:center;padding:20px 0 16px;}
.profile-avatar-big{width:64px;height:64px;border-radius:50%;background:var(--blue-light);color:var(--blue-dark);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.profile-name{font-size:18px;font-weight:700;}
.profile-cargo{font-size:13px;color:var(--text-muted);}
</style>
</head>

let currentUser=null,isAdmin=false,allPreds={},allResults={},allUsers=[],predPhase="Fase de grupos",resPhase="Fase de grupos",timers={};

function ini(n){return n.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function toast(msg,dur=2000){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),dur);}

function calcPts(uid){
  const p=allPreds[uid]||{};let pts=0,exact=0,partial=0;
  MATCHES.forEach(m=>{
    const pr=p[m.id],r=allResults[m.id];
    if(!pr||pr.home==null||pr.away==null||!r||r.home==null||r.away==null)return;
    if(pr.home===r.home&&pr.away===r.away){pts+=3;exact++;return;}
    const pW=pr.home>pr.away?'H':pr.home<pr.away?'A':'D';
    const rW=r.home>r.away?'H':r.home<r.away?'A':'D';
    if(pW===rW){pts+=1;partial++;}
  });
  return{pts,exact,partial};
}

function getPtsM(uid,mid){
  const p=(allPreds[uid]||{})[mid],r=allResults[mid];
  if(!p||p.home==null||p.away==null||!r||r.home==null||r.away==null)return null;
  if(p.home===r.home&&p.away===r.away)return 3;
  const pW=p.home>p.away?'H':p.home<p.away?'A':'D';
  const rW=r.home>r.away?'H':r.home<r.away?'A':'D';
  return pW===rW?1:0;
}

function toggleAdmin(){const f=document.getElementById('admin-field');f.style.display=f.style.display==='none'?'block':'none';}

async function registrarse(){
  const nombre=document.getElementById('inp-nombre').value.trim();
  const cargo=document.getElementById('inp-cargo').value.trim();
  const pass=document.getElementById('inp-admin-pass').value;
  if(!nombre){toast('Escribe tu nombre');return;}
  if(!cargo){toast('Escribe tu cargo');return;}
  const btn=document.getElementById('btn-entrar');
  btn.disabled=true;btn.textContent='Entrando...';
  try{
    const{data:ex,error:e1}=await db.from('usuarios').select('*').ilike('nombre',nombre).single();
    if(ex){
      currentUser=ex;isAdmin=ex.es_admin||(pass===ADMIN_PASSWORD);
      await mostrarApp();
    } else {
      const admin=pass===ADMIN_PASSWORD;
      const{data,error}=await db.from('usuarios').insert([{nombre,cargo,es_admin:admin}]).single();
      if(error)throw error;
      currentUser=data;isAdmin=admin;
      await mostrarApp();
    }
  }catch(e){
    console.error(e);
    toast('Error: '+e.message);
  }
  btn.disabled=false;btn.textContent='Entrar a la polla';
}

async function intentarAutoLogin(){
  const id=localStorage.getItem('wc26_uid');
  if(!id)return false;
  const{data}=await db.from('usuarios').select('*').eq('id',id).single();
  if(data){currentUser=data;isAdmin=data.es_admin;return true;}
  return false;
}

function cerrarSesion(){
  localStorage.removeItem('wc26_uid');
  currentUser=null;isAdmin=false;
  document.getElementById('app-header').style.display='none';
  document.getElementById('bottom-nav').style.display='none';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
}

async function mostrarApp(){
  localStorage.setItem('wc26_uid',currentUser.id);
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('app-header').style.display='flex';
  document.getElementById('bottom-nav').style.display='flex';
  document.getElementById('header-info').textContent=currentUser.nombre+' · '+(isAdmin?'Admin':currentUser.cargo);
  if(isAdmin)document.getElementById('nav-resultados').style.display='flex';
  await loadData();
  goTo('pronosticos');
  setupRealtime();
}

async function loadData(){
  const[p,r,u]=await Promise.all([
    db.from('pronosticos').select('*'),
    db.from('resultados').select('*'),
    db.from('usuarios').select('*')
  ]);
  allPreds={};
  (p.data||[]).forEach(x=>{if(!allPreds[x.usuario_id])allPreds[x.usuario_id]={};allPreds[x.usuario_id][x.match_id]={home:x.home,away:x.away};});
  allResults={};
  (r.data||[]).forEach(x=>{allResults[x.match_id]={home:x.home,away:x.away};});
  allUsers=u.data||[];
}

function setupRealtime(){
  db.from('resultados').on('*',()=>{loadData().then(()=>refresh());}).subscribe();
  db.from('pronosticos').on('*',()=>{loadData().then(()=>refresh());}).subscribe();
  db.from('usuarios').on('*',()=>{loadData().then(()=>refresh());}).subscribe();
}

function refresh(){
  const a=document.querySelector('.screen.active');
  if(!a)return;
  const id=a.id.replace('screen-','');
  if(id==='pronosticos')renderPred();
  if(id==='resultados')renderRes();
  if(id==='ranking')renderRanking();
  if(id==='perfil')renderPerfil();
}

function goTo(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  document.getElementById('nav-'+s).classList.add('active');
  if(s==='pronosticos')renderPred();
  if(s==='resultados')renderRes();
  if(s==='ranking')renderRanking();
  if(s==='perfil')renderPerfil();
}

function chips(cid,cur,fn){
  document.getElementById(cid).innerHTML=PHASES.map(p=>`<div class="phase-chip ${p===cur?'active':''}" onclick="${fn}('${p}')">${p}</div>`).join('');
}

function setPredPhase(p){predPhase=p;renderPred();}
function setResPhase(p){resPhase=p;renderRes();}

function byDate(ms){const d={};ms.forEach(m=>{if(!d[m.date])d[m.date]=[];d[m.date].push(m);});return d;}

function renderPred(){
  chips('chips-pred',predPhase,'setPredPhase');
  const p=allPreds[currentUser.id]||{};
  const ms=MATCHES.filter(m=>m.phase===predPhase);
  const bd=byDate(ms);
  document.getElementById('list-pred').innerHTML=Object.entries(bd).map(([date,matches])=>`
    <div class="day-sep">${date}</div>
    ${matches.map(m=>{
      const pr=p[m.id]||{},r=allResults[m.id];
      const hasR=r&&r.home!=null&&r.away!=null;
      const pts=getPtsM(currentUser.id,m.id);
      const badge=pts===3?'<span class="pts-pill pts-3">+3 pts</span>':pts===1?'<span class="pts-pill pts-1">+1 pt</span>':pts===0?'<span class="pts-pill pts-0">+0</span>':'';
      return`<div class="match-card ${hasR?'has-result':''}">
        <div class="match-meta"><span>${m.group||m.phase}</span><span>${m.venue}</span></div>
        <div class="match-body">
          <span class="team">${m.home}</span>
          <div class="scores">
            <input class="score-box" type="number" min="0" max="30" inputmode="numeric" value="${pr.home!=null?pr.home:''}" placeholder="-" onchange="savePred(${m.id},'home',this.value,'fl${m.id}')"/>
            <span class="score-sep">-</span>
            <input class="score-box" type="number" min="0" max="30" inputmode="numeric" value="${pr.away!=null?pr.away:''}" placeholder="-" onchange="savePred(${m.id},'away',this.value,'fl${m.id}')"/>
          </div>
          <span class="team right">${m.away}</span>
        </div>
        ${hasR?`<div class="result-row"><span class="real-label">Real: ${r.home}-${r.away}</span>${badge}</div>`:''}
        <div class="saved-flash" id="fl${m.id}"></div>
      </div>`;
    }).join('')}
  `).join('');
}

async function savePred(mid,side,val,fid){
  const v=parseInt(val);const value=isNaN(v)?null:Math.max(0,v);
  if(!allPreds[currentUser.id])allPreds[currentUser.id]={};
  if(!allPreds[currentUser.id][mid])allPreds[currentUser.id][mid]={};
  allPreds[currentUser.id][mid][side]=value;
  clearTimeout(timers[mid+'_'+side]);
  timers[mid+'_'+side]=setTimeout(async()=>{
    const pr=allPreds[currentUser.id][mid];
    await db.from('pronosticos').upsert({usuario_id:currentUser.id,match_id:mid,home:pr.home??null,away:pr.away??null},{onConflict:'usuario_id,match_id'});
    const e=document.getElementById(fid);if(e){e.textContent='Guardado';setTimeout(()=>{if(e)e.textContent='';},1500);}
  },600);
}

function renderRes(){
  if(!isAdmin){document.getElementById('list-res').innerHTML='<div class="loading">Solo el administrador puede introducir resultados.</div>';return;}
  chips('chips-res',resPhase,'setResPhase');
  const ms=MATCHES.filter(m=>m.phase===resPhase);
  const bd=byDate(ms);
  document.getElementById('list-res').innerHTML=Object.entries(bd).map(([date,matches])=>`
    <div class="day-sep">${date}</div>
    ${matches.map(m=>{
      const r=allResults[m.id]||{};const hasR=r.home!=null&&r.away!=null;
      return`<div class="match-card ${hasR?'has-result':''}">
        <div class="match-meta"><span>${m.group||m.phase}</span><span>${m.venue}</span></div>
        <div class="match-body">
          <span class="team">${m.home}</span>
          <div class="scores">
            <input class="score-box real" type="number" min="0" max="30" inputmode="numeric" value="${r.home!=null?r.home:''}" placeholder="-" onchange="saveRes(${m.id},'home',this.value,'rf${m.id}')"/>
            <span class="score-sep" style="color:var(--green)">-</span>
            <input class="score-box real" type="number" min="0" max="30" inputmode="numeric" value="${r.away!=null?r.away:''}" placeholder="-" onchange="saveRes(${m.id},'away',this.value,'rf${m.id}')"/>
          </div>
          <span class="team right">${m.away}</span>
        </div>
        ${hasR?`<div style="text-align:center;margin-top:4px;font-size:11px;color:var(--green)">Resultado registrado para todos</div>`:''}
        <div class="saved-flash" id="rf${m.id}"></div>
      </div>`;
    }).join('')}
  `).join('');
}

async function saveRes(mid,side,val,fid){
  const v=parseInt(val);const value=isNaN(v)?null:Math.max(0,v);
  if(!allResults[mid])allResults[mid]={};
  allResults[mid][side]=value;
  clearTimeout(timers['r'+mid+'_'+side]);
  timers['r'+mid+'_'+side]=setTimeout(async()=>{
    const r=allResults[mid];
    await db.from('resultados').upsert({match_id:mid,home:r.home??null,away:r.away??null},{onConflict:'match_id'});
    const e=document.getElementById(fid);if(e){e.textContent='Guardado para todos';setTimeout(()=>{if(e)e.textContent='';},2000);}
  },600);
}

function renderRanking(){
  const totalRes=Object.values(allResults).filter(r=>r&&r.home!=null&&r.away!=null).length;
  const sorted=allUsers.map(u=>({...u,...calcPts(u.id)})).sort((a,b)=>b.pts-a.pts);
  const medals=['🥇','🥈','🥉'];
  document.getElementById('ranking-content').innerHTML=`
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num">${allUsers.length}</div><div class="stat-lbl">Participantes</div></div>
      <div class="stat-box"><div class="stat-num">${totalRes}</div><div class="stat-lbl">Partidos jugados</div></div>
      <div class="stat-box"><div class="stat-num">${sorted[0]?sorted[0].pts:0}</div><div class="stat-lbl">Puntos lider</div></div>
    </div>
    <div class="card">
      ${sorted.map((u,i)=>{const me=u.id===currentUser.id;return`<div class="rank-row ${me?'rank-me':''}">
        <span class="rank-pos">${medals[i]||(i+1)}</span>
        <div class="rank-avatar">${ini(u.nombre)}</div>
        <div class="rank-info"><div class="rank-name">${u.nombre}${me?' (tu)':''}</div><div class="rank-cargo">${u.cargo}</div></div>
        <div style="text-align:right"><div class="rank-pts">${u.pts}</div><div class="rank-detail">${u.exact} exactos · ${u.partial} parciales</div></div>
      </div>`;}).join('')}
    </div>
    <div class="info-box" style="margin-top:4px;font-size:11px;">3 pts resultado exacto · 1 pt ganador o empate correcto</div>`;
}

function renderPerfil(){
  const{pts,exact,partial}=calcPts(currentUser.id);
  const done=Object.values(allPreds[currentUser.id]||{}).filter(p=>p.home!=null&&p.away!=null).length;
  const sorted=allUsers.map(u=>({...u,...calcPts(u.id)})).sort((a,b)=>b.pts-a.pts);
  const pos=sorted.findIndex(u=>u.id===currentUser.id)+1;
  document.getElementById('perfil-content').innerHTML=`
    <div class="profile-header">
      <div class="profile-avatar-big">${ini(currentUser.nombre)}</div>
      <div class="profile-name">${currentUser.nombre}</div>
      <div class="profile-cargo">${currentUser.cargo}${isAdmin?' · Admin':''}</div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num">${pts}</div><div class="stat-lbl">Puntos</div></div>
      <div class="stat-box"><div class="stat-num">${exact}</div><div class="stat-lbl">Exactos</div></div>
      <div class="stat-box"><div class="stat-num">${pos}°</div><div class="stat-lbl">Posicion</div></div>
    </div>
    <div class="card">
      <div class="rank-row"><span style="color:var(--text-muted);font-size:13px;flex:1">Pronosticos rellenados</span><span style="font-weight:600">${done}/${MATCHES.length}</span></div>
      <div class="rank-row"><span style="color:var(--text-muted);font-size:13px;flex:1">Aciertos exactos</span><span style="font-weight:600;color:var(--green)">${exact}</span></div>
      <div class="rank-row"><span style="color:var(--text-muted);font-size:13px;flex:1">Aciertos parciales</span><span style="font-weight:600;color:var(--amber)">${partial}</span></div>
    </div>
    <button class="btn btn-outline" style="margin-top:8px" onclick="cerrarSesion()">Cerrar sesion</button>`;
}

(async()=>{
  const auto=await intentarAutoLogin();
  if(auto)await mostrarApp();
})();
</script>
