    --amber: #BA7517; --amber-light: #FAEEDA;
    --red: #A32D2D; --red-light: #FCEBEB;
    --gray: #5F5E5A; --gray-light: #F1EFE8; --gray-mid: #D3D1C7;
    --text: #1a1a18; --text-muted: #5F5E5A;
    --bg: #ffffff; --bg-secondary: #F7F6F2; --bg-tertiary: #F1EFE8;
    --border: rgba(0,0,0,0.12); --border-mid: rgba(0,0,0,0.2);
    --radius: 10px; --radius-sm: 6px; --radius-lg: 14px;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-secondary); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .app-header { background: var(--blue); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .app-header h1 { font-size: 16px; font-weight: 600; }
  .app-header p { font-size: 11px; opacity: 0.8; margin-top: 1px; }
  .btn-logout { background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: var(--radius-sm); cursor: pointer; }

  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 0.5px solid var(--border); display: flex; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 4px 12px; cursor: pointer; color: var(--text-muted); font-size: 10px; gap: 3px; border: none; background: none; }
  .nav-item.active { color: var(--blue); }
  .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* SCREENS */
  .screen { display: none; padding: 16px 12px 90px; max-width: 600px; margin: 0 auto; }
  .screen.active { display: block; }

  /* CARDS */
  .card { background: #fff; border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 14px; margin-bottom: 10px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }

  /* FORMS */
  .field { margin-bottom: 12px; }
  .field label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-mid); border-radius: var(--radius); font-size: 15px; background: #fff; color: var(--text); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--blue); }
  .btn { display: block; width: 100%; padding: 13px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-blue:hover { background: var(--blue-dark); }
  .btn-outline { background: transparent; border: 1px solid var(--border-mid); color: var(--text); font-size: 14px; font-weight: 500; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* LOGIN */
  #screen-login { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 32px 20px 40px; max-width: 420px; margin: 0 auto; }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .ball { font-size: 56px; display: block; }
  .login-logo h2 { font-size: 22px; font-weight: 700; color: var(--text); }
  .login-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .divider { text-align: center; color: var(--text-muted); font-size: 13px; margin: 16px 0; position: relative; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 0.5px; background: var(--border-mid); }
  .divider::before { left: 0; } .divider::after { right: 0; }

  /* MATCH CARDS */
  .match-card { background: #fff; border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 12px; margin-bottom: 8px; }
  .match-card.has-result { border-color: var(--green); }
  .match-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .match-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
  .team { font-size: 13px; font-weight: 600; }
  .team.right { text-align: right; }
  .scores { display: flex; gap: 6px; align-items: center; }
  .score-box { width: 40px; height: 38px; text-align: center; font-size: 18px; font-weight: 700; border: 1.5px solid var(--border-mid); border-radius: var(--radius-sm); background: var(--bg-secondary); color: var(--text); -moz-appearance: textfield; }
  .score-box::-webkit-outer-spin-button, .score-box::-webkit-inner-spin-button { -webkit-appearance: none; }
  .score-box:focus { outline: none; border-color: var(--blue); background: var(--blue-light); }
  .score-box.real { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
  .score-sep { font-size: 16px; color: var(--text-muted); }
  .pts-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-top: 6px; }
  .pts-3 { background: var(--green-light); color: var(--green-dark); }
  .pts-1 { background: var(--amber-light); color: var(--amber); }
  .pts-0 { background: var(--gray-light); color: var(--gray); }
  .result-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .real-label { font-size: 11px; color: var(--green); }

  /* DAY GROUP */
  .day-sep { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 14px 2px 6px; border-bottom: 0.5px solid var(--border); margin-bottom: 8px; }

  /* PHASE FILTER */
  .phase-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 4px; scrollbar-width: none; }
  .phase-scroll::-webkit-scrollbar { display: none; }
  .phase-chip { flex-shrink: 0; padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border-mid); font-size: 12px; font-weight: 500; cursor: pointer; background: #fff; color: var(--text-muted); white-space: nowrap; }
  .phase-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* RANKING */
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .rank-row:last-child { border-bottom: none; }
  .rank-pos { font-size: 15px; width: 28px; text-align: center; }
  .rank-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue-light); color: var(--blue-dark); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-cargo { font-size: 11px; color: var(--text-muted); }
  .rank-pts { font-size: 18px; font-weight: 700; color: var(--blue); }
  .rank-detail { font-size: 11px; color: var(--text-muted); text-align: right; }
  .rank-me { background: var(--blue-light); border-radius: var(--radius); padding: 2px 4px; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat-box { background: var(--bg-secondary); border-radius: var(--radius); padding: 10px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--blue); }
  .stat-lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

  /* ADMIN BADGE */
  .admin-badge { background: var(--amber-light); color: var(--amber); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }

  /* TOAST */
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1a1a18; color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border-mid); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* INFO BOX */
  .info-box { background: var(--blue-light); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; color: var(--blue-dark); margin-bottom: 12px; line-height: 1.5; }
  .info-box.green { background: var(--green-light); color: var(--green-dark); }

  .saved-flash { font-size: 11px; color: var(--green); text-align: center; margin-top: 4px; min-height: 16px; }

  /* PROFILE */
  .profile-header { text-align: center; padding: 20px 0 16px; }
  .profile-avatar-big { width: 64px; height: 64px; border-radius: 50%; background: var(--blue-light); color: var(--blue-dark); font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
  .profile-name { font-size: 18px; font-weight: 700; }
  .profile-cargo { font-size: 13px; color: var(--text-muted); }
</style>
</head>

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function initials(name) {
  return name.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function toast(msg, dur=2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), dur);
}

function calcPts(userId) {
  const preds = allPredictions[userId] || {};
  let pts=0, exact=0, partial=0;
  MATCHES.forEach(m => {
    const p = preds[m.id];
    const r = allResults[m.id];
    if (!p||p.home==null||p.away==null||!r||r.home==null||r.away==null) return;
    if (p.home===r.home && p.away===r.away) { pts+=3; exact++; return; }
    const pW = p.home>p.away?'H':p.home<p.away?'A':'D';
    const rW = r.home>r.away?'H':r.home<r.away?'A':'D';
    if (pW===rW) { pts+=1; partial++; }
  });
  return {pts,exact,partial};
}

function getPtsMatch(userId, matchId) {
  const p = (allPredictions[userId]||{})[matchId];
  const r = allResults[matchId];
  if (!p||p.home==null||p.away==null||!r||r.home==null||r.away==null) return null;
  if (p.home===r.home && p.away===r.away) return 3;
  const pW=p.home>p.away?'H':p.home<p.away?'A':'D';
  const rW=r.home>r.away?'H':r.home<r.away?'A':'D';
  return pW===rW?1:0;
}

// AUTH / LOGIN
// ═══════════════════════════════════════════
function toggleAdminField() {
  const f = document.getElementById('admin-field');
  f.style.display = f.style.display==='none' ? 'block' : 'none';
}

async function registrarse() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const cargo = document.getElementById('inp-cargo').value.trim();
  const adminPass = document.getElementById('inp-admin-pass').value;

  if (!nombre) { toast('Escribe tu nombre'); return; }
  if (!cargo) { toast('Escribe tu cargo'); return; }

  const admin = adminPass === ADMIN_PASSWORD;

  const btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = 'Entrando...';

  try {
    // Check if user exists
    const { data: existing } = await db.from('usuarios').select('*').ilike('nombre', nombre).single();
    if (existing) {
      entrarComoUsuario(existing);
    } else {
      const { data, error } = await db.from('usuarios').insert([{ nombre, cargo, es_admin: admin }]).select().single();
      if (error) throw error;
      entrarComoUsuario(data);
    }
  } catch(e) {
    toast('Error al conectar. Verifica la configuración de Supabase.');
    console.error(e);
  }
  btn.disabled = false; btn.textContent = 'Entrar a la polla';
}

function entrarComoUsuario(user) {
  currentUser = user;
  isAdmin = user.es_admin;
  localStorage.setItem('wc26_user_id', user.id);
  localStorage.setItem('wc26_user_nombre', user.nombre);
  mostrarApp();
}

async function intentarAutoLogin() {
  const id = localStorage.getItem('wc26_user_id');
  if (!id) return false;
  const { data } = await db.from('usuarios').select('*').eq('id', id).single();
  if (data) { entrarComoUsuario(data); return true; }
  return false;
}

function cerrarSesion() {
  localStorage.removeItem('wc26_user_id');
  localStorage.removeItem('wc26_user_nombre');
  currentUser = null; isAdmin = false;
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('app-header').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
}

// APP INIT
// ═══════════════════════════════════════════
async function mostrarApp() {
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('app-header').style.display = 'flex';
  document.getElementById('bottom-nav').style.display = 'flex';
  document.getElementById('header-user-info').textContent =
    currentUser.nombre + (isAdmin ? ' · Admin' : ' · ' + currentUser.cargo);
  if (isAdmin) document.getElementById('nav-resultados').style.display = 'flex';

  await loadAllData();
  goTo('pronosticos');
  setupRealtime();
}

async function loadAllData() {
  const [predsRes, resultsRes, usersRes] = await Promise.all([
    db.from('pronosticos').select('*'),
    db.from('resultados').select('*'),
    db.from('usuarios').select('*')
  ]);

  allPredictions = {};
  (predsRes.data||[]).forEach(r => {
    if (!allPredictions[r.usuario_id]) allPredictions[r.usuario_id] = {};
    allPredictions[r.usuario_id][r.match_id] = { home: r.home, away: r.away };
  });

  allResults = {};
  (resultsRes.data||[]).forEach(r => {
    allResults[r.match_id] = { home: r.home, away: r.away };
  });

  allUsers = usersRes.data || [];
}

function setupRealtime() {
  db.channel('polla-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'resultados' }, payload => {
      const r = payload.new;
      if (r) allResults[r.match_id] = { home: r.home, away: r.away };
      refreshCurrentScreen();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pronosticos' }, payload => {
      const r = payload.new;
      if (r) {
        if (!allPredictions[r.usuario_id]) allPredictions[r.usuario_id] = {};
        allPredictions[r.usuario_id][r.match_id] = { home: r.home, away: r.away };
      }
      refreshCurrentScreen();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'usuarios' }, async () => {
      const { data } = await db.from('usuarios').select('*');
      allUsers = data || [];
      refreshCurrentScreen();
    })
    .subscribe();
}

function refreshCurrentScreen() {
  const active = document.querySelector('.screen.active');
  if (!active) return;
  const id = active.id.replace('screen-','');
  if (id==='pronosticos') renderPronosticos();
  if (id==='resultados') renderResultados();
  if (id==='ranking') renderRanking();
  if (id==='perfil') renderPerfil();
}

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  document.getElementById('nav-'+screen).classList.add('active');
  if (screen==='pronosticos') renderPronosticos();
  if (screen==='resultados') renderResultados();
  if (screen==='ranking') renderRanking();
  if (screen==='perfil') renderPerfil();
}

function renderPhaseChips(containerId, currentPhase, onSelect) {
  const el = document.getElementById(containerId);
  el.innerHTML = PHASES.map(ph =>
    `<div class="phase-chip ${ph===currentPhase?'active':''}" onclick="${onSelect}('${ph}')">${ph}</div>`
  ).join('');
}

function setPhasePred(ph) { currentPredPhase=ph; renderPronosticos(); }
function setPhaseRes(ph) { currentResPhase=ph; renderResultados(); }

function renderPronosticos() {
  renderPhaseChips('phase-chips-pred', currentPredPhase, 'setPhasePred');
  const preds = allPredictions[currentUser.id] || {};
  const ms = MATCHES.filter(m=>m.phase===currentPredPhase);
  const byDate = {};
  ms.forEach(m=>{ if(!byDate[m.date])byDate[m.date]=[]; byDate[m.date].push(m); });

  const html = Object.entries(byDate).map(([date,matches]) => `
    <div class="day-sep">${date}</div>
    ${matches.map(m => {
      const p = preds[m.id]||{};
      const r = allResults[m.id];
      const hasResult = r&&r.home!=null&&r.away!=null;
      const pts = getPtsMatch(currentUser.id, m.id);
      const ptsBadge = pts===3?'<span class="pts-pill pts-3">+3 pts ✓</span>':pts===1?'<span class="pts-pill pts-1">+1 pt</span>':pts===0?'<span class="pts-pill pts-0">+0</span>':'';
      return `<div class="match-card ${hasResult?'has-result':''}">
        <div class="match-meta">
          <span>${m.group||m.phase}</span>
          <span>${m.venue}</span>
        </div>
        <div class="match-body">
          <span class="team">${m.home}</span>
          <div class="scores">
            <input class="score-box" type="number" min="0" max="30" inputmode="numeric"
              value="${p.home!=null?p.home:''}" placeholder="–"
              onchange="savePred(${m.id},'home',this.value,'flash-${m.id}')"/>
            <span class="score-sep">–</span>
            <input class="score-box" type="number" min="0" max="30" inputmode="numeric"
              value="${p.away!=null?p.away:''}" placeholder="–"
              onchange="savePred(${m.id},'away',this.value,'flash-${m.id}')"/>
          </div>
          <span class="team right">${m.away}</span>
        </div>
        ${hasResult?`<div class="result-row"><span class="real-label">Real: ${r.home}–${r.away}</span>${ptsBadge}</div>`:''}
        <div class="saved-flash" id="flash-${m.id}"></div>
      </div>`;
    }).join('')}
  `).join('');

  document.getElementById('pronosticos-list').innerHTML = html || '<div class="loading">Sin partidos en esta fase.</div>';
}

async function savePred(matchId, side, val, flashId) {
  const v = parseInt(val);
  const value = isNaN(v) ? null : Math.max(0,v);

  if (!allPredictions[currentUser.id]) allPredictions[currentUser.id]={};
  if (!allPredictions[currentUser.id][matchId]) allPredictions[currentUser.id][matchId]={};
  allPredictions[currentUser.id][matchId][side] = value;

  clearTimeout(saveTimers[`${matchId}_${side}`]);
  saveTimers[`${matchId}_${side}`] = setTimeout(async () => {
    const pred = allPredictions[currentUser.id][matchId];
    await db.from('pronosticos').upsert({
      usuario_id: currentUser.id,
      match_id: matchId,
      home: pred.home ?? null,
      away: pred.away ?? null
    }, { onConflict: 'usuario_id,match_id' });

    const el = document.getElementById(flashId);
    if (el) { el.textContent = '✓ Guardado'; setTimeout(()=>{ if(el) el.textContent=''; },1500); }
  }, 600);
}

function renderResultados() {
  if (!isAdmin) { document.getElementById('resultados-list').innerHTML='<div class="loading">Solo el administrador puede introducir resultados.</div>'; return; }
  renderPhaseChips('phase-chips-res', currentResPhase, 'setPhaseRes');
  const ms = MATCHES.filter(m=>m.phase===currentResPhase);
  const byDate={};
  ms.forEach(m=>{ if(!byDate[m.date])byDate[m.date]=[]; byDate[m.date].push(m); });

  const html = Object.entries(byDate).map(([date,matches]) => `
    <div class="day-sep">${date}</div>
    ${matches.map(m => {
      const r = allResults[m.id]||{};
      const hasResult = r.home!=null&&r.away!=null;
      return `<div class="match-card ${hasResult?'has-result':''}">
        <div class="match-meta">
          <span>${m.group||m.phase}</span>
          <span>${m.venue}</span>
        </div>
        <div class="match-body">
          <span class="team">${m.home}</span>
          <div class="scores">
            <input class="score-box real" type="number" min="0" max="30" inputmode="numeric"
              value="${r.home!=null?r.home:''}" placeholder="–"
              onchange="saveResult(${m.id},'home',this.value,'rflash-${m.id}')"/>
            <span class="score-sep" style="color:var(--green)">–</span>
            <input class="score-box real" type="number" min="0" max="30" inputmode="numeric"
              value="${r.away!=null?r.away:''}" placeholder="–"
              onchange="saveResult(${m.id},'away',this.value,'rflash-${m.id}')"/>

      </div>`;
    }).join('')}
  `).join('');

async function saveResult(matchId, side, val, flashId) {
  const v = parseInt(val);
  const value = isNaN(v) ? null : Math.max(0,v);
  if (!allResults[matchId]) allResults[matchId]={};
  allResults[matchId][side] = value;

  clearTimeout(saveTimers[`res_${matchId}_${side}`]);
  saveTimers[`res_${matchId}_${side}`] = setTimeout(async () => {
    const r = allResults[matchId];
    await db.from('resultados').upsert({
      match_id: matchId,
      home: r.home ?? null,
      away: r.away ?? null
    }, { onConflict: 'match_id' });
    const el = document.getElementById(flashId);
    if (el) { el.textContent='✓ Guardado para todos'; setTimeout(()=>{ if(el) el.textContent=''; },2000); }
  }, 600);
}

    <button class="btn btn-outline" style="margin-top:8px;" onclick="cerrarSesion()">Cerrar sesión</button>
  `;
}

(async () => {
  const auto = await intentarAutoLogin();
  if (!auto) {
    document.getElementById('screen-login').classList.add('active');
  }
})();
</script>
